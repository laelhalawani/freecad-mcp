name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs these jobs for a tag before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The headless runner's tests use Python in place of freecadcmd.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o dist/ .

  # install.sh's shell-profile edits and their undo, under a strict POSIX
  # shell (dash) and macOS's sh.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: macos-latest
            shell: sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: ${{ matrix.shell }} tests/install_sh_test.sh

  # install.ps1 parses under Windows PowerShell 5.1 and PowerShell 7. The
  # script is only parsed, never run.
  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path install.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          foreach ($e in $errors) {
            $message = $e.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=install.ps1,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$message"
          }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Output "install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path install.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          foreach ($e in $errors) {
            $message = $e.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=install.ps1,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$message"
          }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Output "install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

  # The FreeCAD addon is Python and runs inside FreeCAD (Python 3.11 in
  # FreeCAD 1.x), so its tests run on the oldest Python FreeCAD bundles,
  # and on every OS FreeCAD ships for: sockets and clocks differ on Windows.
  addon:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the addon
        run: python -m compileall -q addon

      - name: Test
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests
