version: 2

project_name: freecad-mcp

builds:
  - id: freecad-mcp
    main: .
    binary: freecad-mcp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [binary]
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'

checksum:
  name_template: SHA256SUMS.txt

release:
  # Tags like v0.2.1-rc.1 publish as pre-releases, which /releases/latest
  # (the install scripts and `update`) never picks.
  prerelease: auto
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1

changelog:
  disable: true
